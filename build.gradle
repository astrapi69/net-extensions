buildscript {
    repositories {
        maven {
            setUrl(projectRepositoriesMavenUrl)
        }
    }
}

plugins {
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.grgit.gradle)
    alias(libs.plugins.japicmp.gradle.plugin)
    alias(libs.plugins.license.gradle.plugin)
    alias(libs.plugins.lombok.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.version.catalog.update)
}

group = groupPackage
version = projectVersion
description = rootProject.name

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

apply from: "gradle/test-results-complete.gradle"

// registered here because a script applied with apply from does not see the classes of the plugins above;
// gradle/japicmp.gradle configures it
tasks.register("japicmp", me.champeau.gradle.japicmp.JapicmpTask)
apply from: "gradle/japicmp.gradle"
