// The binary compatibility gate: japicmp compares the jar of this build with the last release of this artifact.
//
// 6.1 shipped as a minor release and broke callers compiled against 6.0 (see "Known issues" of 6.1 in
// CHANGELOG.md), and nothing in the build said so. Now, with the same major version as the release, a binary
// incompatible change fails the build, because a minor or patch release must not break a caller. With a higher
// major it is written to the report and the build goes on, because a major is where breaking changes belong.
//
// The baseline is <group>:<artifact>:latest.release without its dependencies, from Maven Central only: the
// repository below is the only one asked for this module, so a jar installed into mavenLocal never becomes the
// baseline. Missing classes of third-party dependencies are ignored; the report is under build/reports/japicmp/.
// The task is registered in build.gradle, which sees the classes of the plugin.
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'MavenCentralReleaseBaseline'
                url = 'https://repo.maven.apache.org/maven2/'
            }
        }
        filter {
            includeModule(groupPackage, rootProject.name)
        }
    }
}

def releaseBaseline = configurations.detachedConfiguration(
    dependencies.create("${groupPackage}:${rootProject.name}:latest.release"))
releaseBaseline.transitive = false

def majorOf = { String version -> Integer.parseInt(version.tokenize('.-')[0]) }
def currentVersion = projectVersion as String
def baseline = null
// Gradle answers this project's own coordinates with the project itself, even in a detached configuration
// ("Unable to find a matching variant of root project"), so the project carries another group while the
// baseline resolves.
def resolveBaseline = {
    if (baseline == null) {
        def ownGroup = project.group
        project.group = 'japicmp.release.baseline'
        try {
            def results = releaseBaseline.incoming.resolutionResult.root.dependencies
            def unresolved = results.findAll { it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult }
            if (unresolved) {
                throw new GradleException("japicmp: ${groupPackage}:${rootProject.name}:latest.release could not " +
                    "be resolved from Maven Central", unresolved[0].failure)
            }
            def selected = results.collect { it.selected.id }
            def files = releaseBaseline.files as List
            // fail closed: a baseline that is not one published release compares nothing and would report green
            if (selected.size() != 1 || files.size() != 1
                || !(selected[0] instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)
                || selected[0].group != groupPackage || selected[0].module != rootProject.name
                || selected[0].version == currentVersion || selected[0].version.endsWith('-SNAPSHOT')) {
                throw new GradleException("japicmp: the release baseline resolved to ${selected} ${files}, not " +
                    "one published release of ${groupPackage}:${rootProject.name}; refusing to compare")
            }
            baseline = [version: selected[0].version, file: files[0]]
        } finally {
            project.group = ownGroup
        }
    }
    baseline
}

tasks.named('japicmp') {
    group = 'verification'
    description = 'Compares the binary API of this build with the last release on Maven Central'
    oldClasspath.from(provider { resolveBaseline().file })
    newClasspath.from(tasks.named('jar'))
    onlyBinaryIncompatibleModified = true
    ignoreMissingClasses = true
    failOnModification = provider { majorOf(currentVersion) <= majorOf(resolveBaseline().version) }
    htmlOutputFile = layout.buildDirectory.file('reports/japicmp/japicmp.html')
    txtOutputFile = layout.buildDirectory.file('reports/japicmp/japicmp.txt')
    def failing = failOnModification
    doFirst {
        def release = resolveBaseline()
        logger.lifecycle("japicmp: ${currentVersion} against release ${release.version} (${release.file.name}): " +
            (failing.get() ? 'the same major, a binary incompatible change fails the build'
                           : 'a higher major, binary incompatible changes are reported, not refused'))
    }
}

tasks.named('check') {
    dependsOn 'japicmp'
}
